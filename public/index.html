<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TikTok Live Arena</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: transparent; /* Прозрачный фон для OBS */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }
        #leaderboard {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            text-align: center;
            color: #ff0050; /* TikTok pink */
            text-shadow: 0 0 10px rgba(255, 0, 80, 0.5);
        }
        .player-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 12px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease;
        }
        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 12px;
            border: 2px solid #00f2fe; /* TikTok cyan */
            object-fit: cover;
        }
        .player-info {
            flex-grow: 1;
            overflow: hidden;
        }
        .player-name {
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-score {
            font-size: 12px;
            color: #ffaa00;
        }
        #alerts {
            position: absolute;
            bottom: 50px;
            left: 50px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<!-- Таблица лидеров (рейтинг арены) -->
<div id="leaderboard">
    <h2>🏆 ТОП АРЕНЫ</h2>
    <div id="players-list"></div>
</div>

<div id="alerts"></div>

<script>
    // Подключаемся к нашему Node.js серверу по WebSocket
    const ws = new WebSocket(`ws://${window.location.host}`);

    ws.onmessage = function(event) {
        const message = JSON.parse(event.data);

        if (message.type === 'init' || message.type === 'update_leaderboard') {
            renderLeaderboard(message.data);
        }

        if (message.type === 'gift_alert') {
            showAlert(`🎁 ${message.data.nickname} подарил ${message.data.giftName} x${message.data.count}!`);
        }
    };

    function renderLeaderboard(players) {
        const listEl = document.getElementById('players-list');
        listEl.innerHTML = '';

        // Берем топ-10 игроков
        players.slice(0, 10).forEach((player, index) => {
            const item = document.createElement('div');
            item.className = 'player-item';

            const avatar = player.profilePictureUrl
                ? `<img class="player-avatar" src="${player.profilePictureUrl}">`
                : `<div class="player-avatar" style="background:#555"></div>`;

            item.innerHTML = `
                    ${avatar}
                    <div class="player-info">
                        <div class="player-name">${index + 1}. ${player.nickname}</div>
                        <div class="player-score">⭐ ${player.score} очков</div>
                    </div>
                `;
            listEl.appendChild(item);
        });
    }

    function showAlert(text) {
        const alertsEl = document.getElementById('alerts');
        alertsEl.innerHTML = text;
        setTimeout(() => {
            alertsEl.innerHTML = '';
        }, 4000);
    }
</script>
</body>
</html>
